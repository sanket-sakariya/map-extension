apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: map-extractor
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 25Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: map-extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
          - "-c"
          - "shared_buffers=6GB"
          - "-c"
          - "effective_cache_size=10GB"
          - "-c"
          - "work_mem=64MB"
          - "-c"
          - "maintenance_work_mem=512MB"
          - "-c"
          - "random_page_cost=1.1"
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: mapscraper
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: "1"
            memory: 7Gi
          limits:
            cpu: "2"
            memory: 9Gi
      volumes:
      - name: pg-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-sql
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: map-extractor
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
