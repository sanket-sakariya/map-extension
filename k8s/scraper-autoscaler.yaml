apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-autoscaler
  namespace: map-extractor
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: autoscaler
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              BACKEND="http://backend.map-extractor.svc.cluster.local:8000"
              TARGET_SCRAPERS=10

              echo "=== Scraper Autoscaler ==="
              echo "Target: $TARGET_SCRAPERS running scrapers"

              # Check if any GitHub workflows are queued
              QUEUED_RESP=$(curl -s "$BACKEND/api/workflows/queued" 2>/dev/null)
              QUEUED_COUNT=$(echo "$QUEUED_RESP" | grep -o '"queued":[0-9]*' | grep -o '[0-9]*')
              QUEUED_COUNT=${QUEUED_COUNT:-0}
              echo "Queued workflows: $QUEUED_COUNT"

              if [ "$QUEUED_COUNT" -gt 0 ]; then
                echo "Workflows in queue ($QUEUED_COUNT). Skipping this cycle."
                exit 0
              fi

              # Get current active scrapers
              RESPONSE=$(curl -s "$BACKEND/api/scrapers")
              CURRENT=$(echo "$RESPONSE" | grep -o '"count":[0-9]*' | grep -o '[0-9]*')
              CURRENT=${CURRENT:-0}
              echo "Current active scrapers: $CURRENT"

              # Check queue depth
              STATUS=$(curl -s "$BACKEND/api/pipeline/status")
              QUEUE=$(echo "$STATUS" | grep -o '"query_queue":[0-9]*' | grep -o '[0-9]*' | head -1)
              QUEUE=${QUEUE:-0}
              echo "Query queue: $QUEUE"

              # If queue is empty, no need for scrapers
              if [ "$QUEUE" -eq 0 ]; then
                echo "Queue empty. No action needed."
                exit 0
              fi

              # Calculate how many to start to reach target
              if [ "$CURRENT" -lt "$TARGET_SCRAPERS" ]; then
                NEED=$((TARGET_SCRAPERS - CURRENT))
                echo "Need $NEED more scraper(s) to reach target $TARGET_SCRAPERS"
                echo "Starting $NEED scraper(s)..."
                RESULT=$(curl -s -X POST "$BACKEND/api/workflows/start" \
                  -H "Content-Type: application/json" \
                  -d "{\"count\": $NEED}")
                echo "Result: $RESULT"
              else
                echo "Already at target ($CURRENT/$TARGET_SCRAPERS). No action."
              fi

              echo "=== Done ==="
