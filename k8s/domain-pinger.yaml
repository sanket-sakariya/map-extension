# Domain ping workers.
#
# Runs the SAME image as the backend — only the command differs — so there is no
# second image to build, tag or keep in sync. Replicas claim work with
# FOR UPDATE SKIP LOCKED, so scaling this deployment scales throughput linearly
# with no other change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-pinger
  namespace: map-extractor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: domain-pinger
  template:
    metadata:
      labels:
        app: domain-pinger
    spec:
      containers:
      - name: pinger
        image: noasdaewplzc1305/map-extractor-backend:latest
        imagePullPolicy: Always
        command: ["python", "-u", "pinger.py"]
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/mapscraper
        # ── Tier 1: DNS ──
        # Queried straight at public resolvers rather than through CoreDNS, so a
        # sweep of millions of domains never touches cluster DNS.
        - name: PING_RESOLVERS
          value: "1.1.1.1,8.8.8.8,9.9.9.9,1.0.0.1,8.8.4.4"
        - name: PING_CONCURRENCY
          value: "200"
        - name: PING_DNS_TIMEOUT
          value: "3.0"
        # A batch costs max(DNS time, RDAP time). Measured in-cluster: 500
        # domains = ~2s of DNS but ~8s of RDAP, so the DNS tier was idling most
        # of the window. 2000 fills that window with DNS work while RDAP keeps
        # its own polite 5rps — ~4x the sweep rate for the same RDAP load.
        - name: PING_BATCH_SIZE
          value: "2000"
        - name: PING_IDLE_SLEEP
          value: "30"
        # ── Tier 2: IDS bulk availability ──
        # 500 domains per request, so the "is it registered?" question is asked
        # for every domain on every sweep instead of being rationed. IDS_RPS
        # counts REQUESTS, not domains: 5 req/s is ~2500 domains/s.
        - name: IDS_ENABLED
          value: "true"
        - name: IDS_BATCH
          value: "500"
        - name: IDS_RPS
          value: "5"
        - name: IDS_TIMEOUT
          value: "30"

        # ── Tier 3: RDAP ──
        # RDAP is now only for what the first two tiers cannot answer: the expiry
        # date and registrar of a REGISTERED domain. _needs_rdap() skips anything
        # IDS reports as available, so the budget is no longer spent confirming
        # dead domains.
        #
        # RDAP_RPS is the politeness control and the real ceiling; the per-batch
        # budget shapes how much of each batch's wall-clock is RDAP. At 40 it left
        # the limiter ~99% idle. At 250 it runs continuously at its 5rps.
        #
        # Self-balancing: as enrichment completes, fewer domains draw on the
        # budget, batches stop being RDAP-bound, and the sweep speeds back up
        # without any retuning.
        - name: RDAP_ENRICH
          value: "true"
        - name: RDAP_RPS
          value: "5"
        - name: RDAP_BUDGET_PER_BATCH
          value: "250"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 800m
            memory: 512Mi
