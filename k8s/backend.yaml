apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: map-extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: noasdaewplzc1305/map-extractor-backend:v21
        imagePullPolicy: Always
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres:5432/mapscraper
        - name: GITHUB_REPO
          value: aug-026/map
        - name: WORKFLOW_FILE
          value: map-vnc.yaml
        # Public base URL the GitHub Actions scrapers register back on. Held
        # here so it moves with the deployment: the settings-table copy outlived
        # a cluster migration still pointing at the old cluster's load
        # balancer, and every scraper launched afterwards died trying to
        # register against it. The domain is a stable CNAME; the raw
        # *.elb.amazonaws.com hostname changes when the LB is recreated.
        - name: PIPELINE_PUBLIC_URL
          value: https://map.articleinnovator.com
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: map-extractor
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
