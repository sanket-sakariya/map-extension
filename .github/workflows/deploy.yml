name: Deploy Map Extractor

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'k8s/**'
  workflow_dispatch:

env:
  DOCKER_USER: noasdaewplzc1305
  BACKEND_IMAGE: noasdaewplzc1305/map-extractor-backend
  FRONTEND_IMAGE: noasdaewplzc1305/map-extractor-frontend
  NAMESPACE: map-extractor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./pipeline/backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./pipeline/frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m0755 kubectl /usr/local/bin/kubectl

      - name: Configure AWS & kubeconfig
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws eks update-kubeconfig --name article-innovator-eks-aug --region us-east-1

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap postgres-init -n $NAMESPACE \
            --from-file=init.sql=pipeline/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml

          # Restart deployments to pick new images
          kubectl rollout restart deployment/backend -n $NAMESPACE
          kubectl rollout restart deployment/frontend -n $NAMESPACE

          # Wait for rollout
          kubectl rollout status deployment/backend -n $NAMESPACE --timeout=120s
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=120s

          echo "Deployed successfully!"
          kubectl get pods -n $NAMESPACE
